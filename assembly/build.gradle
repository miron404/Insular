apply plugin: 'com.android.application'

// Try reading secrets from file
def secretsPropertiesFile = rootProject.file("secrets.properties")
def secretProperties = new Properties()

if (secretsPropertiesFile.exists()) {
    secretProperties.load(new FileInputStream(secretsPropertiesFile))
}
// Otherwise read from environment variables, this happens in CI
else {
    secretProperties.setProperty("signing_keystore_password", "${System.getenv('KEYSTORE_PASSWORD')}")
    secretProperties.setProperty("signing_key_password", "${System.getenv('KEY_PASSWORD')}")
    secretProperties.setProperty("signing_key_alias", "${System.getenv('KEY_ALIAS')}")
}

android {
    namespace 'com.oasisfeng.island'

    compileSdk this.compileSdkVersion

    defaultConfig {
        applicationId "com.oasisfeng.island"
        minSdkVersion this.minSdkVersion
        targetSdkVersion 34
        resourceConfigurations += ['en', 'zh', 'zh-rTW', 'pt-rBR']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 51508
        // Manually bump the semver version part of the string as necessary
        versionName '5.1.3'
        multiDexEnabled true
    }

    buildFeatures.dataBinding true

    signingConfigs {
        release {
            // You need to specify either an absolute path or include the
            // keystore file in the same directory as the build.gradle file.
            storeFile file("../android-signing-keystore.jks")
            storePassword "${secretProperties['signing_keystore_password']}"
            keyAlias "${secretProperties['signing_key_alias']}"
            keyPassword "${secretProperties['signing_key_password']}"
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only apply the release signing config when the keystore is actually present (local dev
            // with secrets.properties). Without it (e.g. plain CI checkout), the release build is left
            // unsigned, to be signed separately by whoever holds the release key.
            if (signingConfigs.release.storeFile.exists()) signingConfig signingConfigs.release
        }
    }

    flavorDimensions += "packaging"
    flavorDimensions += "distribution"

    productFlavors {
        complete { dimension "packaging" }
        engine   { dimension "packaging" }  // Share application ID to retain the profile ownership when switching builds
        mobile   { dimension "packaging"; applicationIdSuffix ".mobile" }

        normal     { dimension "distribution" }
        googleplay {
            dimension "distribution"
            applicationIdSuffix = ".fdroid"
        }

        fdroid {
            dimension "distribution"
            applicationIdSuffix = ".fdroid"
        }
    }

    android.applicationVariants.all { variant ->
        variant.mergeResources.doFirst {
            variant.sourceSets.each { sourceSet ->
                sourceSet.res.srcDirs = sourceSet.res.srcDirs.collect { dir ->
                    def relDir = relativePath(dir)
                    delete '**/analytics_tracker.xml'
                    copy {
                        from(dir)
                        include '**/*.xml'
                        filteringCharset = 'UTF-8'
                        filter {
                            line -> line
                                    .replace('Island', 'Insular')
                        }
                        into("${buildDir}/tmp/${variant.dirName}/${relDir}")
                    }
                    copy {
                        from(dir)
                        exclude '**/*.xml'
                        into("${buildDir}/tmp/${variant.dirName}/${relDir}")
                    }
                    return "${buildDir}/tmp/${variant.dirName}/${relDir}"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkOnly 'NewApi'
        abortOnError true
        checkReleaseBuilds false
        htmlReport false
        xmlReport false
        textReport true
        textOutput file('stdout')
    }

    repositories.flatDir {
        dirs '../app/libs'
    }
}

dependencies {
    // Complete
    completeImplementation project(':engine')
    completeImplementation project(':mobile')
    completeImplementation project(':installer')
    completeImplementation project(':watcher')
    completeImplementation project(':open')
    completeImplementation project(':sideplay')

    //debugImplementation project(':media')

    // Engine only
    engineImplementation project(':engine')
    // Mobile only
    mobileImplementation project(':mobile')
}
